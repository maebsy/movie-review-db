[project]
name = "movie-review-db"
version = "1.0.0"
description = "Movie rating DB: schema design & SQL queries on SQLite"
readme = "README.md"
requires-python = ">=3.10"
# 표준 라이브러리만 사용한다 (외부 의존성 없음).
dependencies = []

[tool.uv]
# uv 버전도 맞춘다 (CI 는 setup-uv 에서 0.13.0 으로 고정).
required-version = ">=0.13.0"
# 패키지로 설치하지 않고 저장소 루트에서 실행한다 (python -m ... / uv run python -m ...).
package = false

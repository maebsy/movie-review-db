name: sql

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    env:
      UV_LOCKED: 1  # uv.lock 과 pyproject.toml 이 어긋나면 모든 uv 명령이 실패
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      # setup-uv 가 matrix 의 Python 을 설치한다 (.python-version 보다 우선). 외부 의존성은 없다.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
      - name: Schema, constraints, query requirements
        shell: bash
        run: |
          uv run python --version; uv run python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
          uv run python -m unittest discover -s tests -t . -v 2>&1 | tee unittest.log
          exit "${PIPESTATUS[0]}"
      - name: Results are up to date
        run: uv run python scripts/run_all.py --check
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          [ -f unittest.log ] || exit 0
          uv run python - <<'PY'
          import re
          text = "\n" + open("unittest.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?==+\n(?:FAIL|ERROR): )", text)
          for b in blocks[1:]:
              msg = b.strip("=\n")[:3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=unittest::" + msg)
          for line in text.splitlines():
              if "[실패]" in line:
                  print("::error title=run_all --check::" + line[:3000])
          PY
